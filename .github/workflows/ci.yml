name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - development/v0.1.1
  push:
    branches:
      - master
      - development/v0.1.1
      - feature/excel-compare-0.2.0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            universal-qa-utils/pyproject.toml
            universal-qa-utils/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: universal-qa-utils/package-lock.json

      - name: Install PowerShell
        run: |
          . /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion'

      - name: Install the package and test tools
        working-directory: universal-qa-utils
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install the Playwright test runner
        working-directory: universal-qa-utils
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run reconciliation, workbook, Robot, Playwright, and PowerShell tests
        working-directory: universal-qa-utils
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python -P -m pytest tests integration_lab -q

      - name: Run the Robot Framework example
        working-directory: universal-qa-utils
        run: |
          python -m robot \
            --outputdir "${RUNNER_TEMP}/robot-example" \
            --variable "PYTHON:${{ steps.setup-python.outputs.python-path }}" \
            examples/robot_example.robot

      - name: Run the Playwright example
        working-directory: universal-qa-utils
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: npm run test:playwright

  package:
    name: package metadata and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build and validate distributions
        working-directory: universal-qa-utils
        env:
          DIST_DIR: ${{ runner.temp }}/uqu-dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          rm -rf "${DIST_DIR}"
          python -m build --outdir "${DIST_DIR}"
          python -m twine check "${DIST_DIR}"/*
          test ! -e dist

      - name: Inspect wheel metadata and contents
        working-directory: universal-qa-utils
        env:
          DIST_DIR: ${{ runner.temp }}/uqu-dist
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          wheels = sorted(dist.glob("universal_qa_utils-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {wheels}")
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              entry_name = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
              entry_points = archive.read(entry_name).decode()
          forbidden = [
              name
              for name in names
              if name.startswith(("adapters/", "tests/", "integration_lab/", "node_modules/"))
              or ".env" in name
              or name.endswith((".pyc", ".pem", ".key"))
          ]
          if forbidden:
              raise SystemExit(f"Wheel contains files that must stay out of the package: {forbidden}")
          required = (
              "Name: universal-qa-utils",
              "Version: 0.1.1",
              "License-Expression: MIT",
              "Requires-Python: >=3.11",
              "Requires-Dist: pandas>=2.2.2",
              "Requires-Dist: openpyxl>=3.1.5",
          )
          missing = [line for line in required if line not in metadata]
          if missing:
              raise SystemExit(f"Wheel metadata is missing {missing}")
          if "universal_utils/robot/ReconciliationLibrary.py" not in names:
              raise SystemExit("Robot library is missing from the wheel")
          if "universal_utils/excel_compare/engine.py" not in names:
              raise SystemExit("Workbook comparison engine is missing from the wheel")
          for entry in (
              "qa-utils = universal_utils.cli:main",
              "qa-excel-compare = universal_utils.excel_compare.cli:main",
          ):
              if entry not in entry_points:
                  raise SystemExit(f"Console script is missing: {entry}")
          if not any(name.endswith("licenses/LICENSE") for name in names):
              raise SystemExit("MIT license file is missing from the wheel")
          print(wheel.name)
          PY

      - name: Smoke-test both CLIs from the wheel
        working-directory: universal-qa-utils
        env:
          DIST_DIR: ${{ runner.temp }}/uqu-dist
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --upgrade pip
          wheel="$(echo "${DIST_DIR}"/universal_qa_utils-*.whl)"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install "${wheel}"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/wheel-smoke/bin/qa-utils" --help > "${RUNNER_TEMP}/qa-utils-help.txt"
          "${RUNNER_TEMP}/wheel-smoke/bin/qa-excel-compare" --help > "${RUNNER_TEMP}/qa-excel-help.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          def flat(text: str) -> str:
              return " ".join(text.split())

          qa = flat(Path(os.environ["RUNNER_TEMP"], "qa-utils-help.txt").read_text(encoding="utf-8"))
          excel = flat(Path(os.environ["RUNNER_TEMP"], "qa-excel-help.txt").read_text(encoding="utf-8"))
          required = (
              "usage: qa-utils",
              "--config",
              "--source-type",
              "--source-a",
              "--source-b",
              "--sheet-a",
              "--sheet-b",
              "--key-a",
              "--key-b",
              "--field-mapping",
              "--value-mappings",
              "--comparison-rules",
              "--numeric-tolerance",
              "--output-path",
              "--encoding",
              "--delimiter",
              "--ignore-case",
              "--trim-whitespace",
              "--ignore-nulls",
              "--detect-duplicates",
              "--bidirectional",
              "--generate-report",
              "--exit-code-mode",
              "--result-file",
          )
          missing = [item for item in required if item not in qa]
          if missing:
              raise SystemExit(f"qa-utils help is missing {missing}")
          if "qa-excel-compare" in qa:
              raise SystemExit("qa-utils help includes the workbook command")
          excel_required = (
              "usage: qa-excel-compare",
              "--reference",
              "--target",
              "--exit-code-mode",
              "does not calculate formulas",
              "compare charts and shapes",
          )
          excel_missing = [item for item in excel_required if item not in excel]
          if excel_missing:
              raise SystemExit(f"qa-excel-compare help is missing {excel_missing}")
          print("CLI smoke checks passed")
          PY
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install "${wheel}[robot]"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m robot.libdoc universal_utils.robot.ReconciliationLibrary list
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m robot.libdoc universal_utils.excel_compare.robot.ExcelCompareLibrary list

  tosca-gap:
    name: Windows Tosca Commander pending
    runs-on: ubuntu-latest
    steps:
      - name: Record that Tosca Commander is not executed
        run: |
          {
            echo "### Windows Tosca Commander"
            echo "Status: PENDING."
            echo "This job does not install Tosca. A successful result is not Tosca Commander validation."
            echo "The host plan is universal-qa-utils/docs/tosca-windows-validation.md."
          } >> "$GITHUB_STEP_SUMMARY"
