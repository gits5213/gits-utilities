name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build and run Twine check
        working-directory: universal-qa-utils
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          rm -rf "${RUNNER_TEMP}/uqu-release-dist"
          python -m build --outdir "${RUNNER_TEMP}/uqu-release-dist"
          python -m twine check "${RUNNER_TEMP}/uqu-release-dist"/*
          test ! -e dist
          echo "Upload is not part of this workflow."
          echo "After approval, run Twine from a trusted workstation and type the production token only at the hidden prompt."
