[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-qa-utils"
version = "0.2.0"
description = "Parameter-driven reconciliation utilities for Python test automation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.2",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/gits5213/gits-utilities"
Source = "https://github.com/gits5213/gits-utilities/tree/master/universal-qa-utils"
Issues = "https://github.com/gits5213/gits-utilities/issues"
Documentation = "https://github.com/gits5213/gits-utilities/tree/master/universal-qa-utils/docs"

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "robotframework>=7.0", "build>=1.2.2"]
robot = ["robotframework>=7.0"]

[project.scripts]
qa-utils = "universal_utils.cli:main"
universal-qa-utils = "universal_utils.cli:main"
qa-excel-compare = "universal_utils.excel_compare.cli:main"

[tool.setuptools.packages.find]
include = ["universal_utils*"]

[tool.setuptools.package-data]
universal_utils = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "integration_lab"]
addopts = "-q"
